<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#07080f" />
  <title>Planet Panic</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { width: 100%; height: 100%; background: #07080f; overflow: hidden; font-family: monospace; color: #e2e8f0; }
    #app { width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    canvas { display: block; touch-action: none; }

    /* ── Screens ── */
    .screen { position: absolute; top: 0; left: 0; right: 0; bottom: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 24px; }
    .screen.hidden { display: none; }

    /* ── Typography ── */
    .game-title { font-size: 32px; letter-spacing: 4px; color: #a78bfa; text-shadow: 0 0 30px #7c3aed66; }
    .sub { font-size: 12px; letter-spacing: 2px; color: #4a4a6a; }
    .label { font-size: 11px; letter-spacing: 1px; color: #4a5568; text-transform: uppercase; margin-bottom: 4px; }

    /* ── Inputs ── */
    input {
      background: #111827; border: 1px solid #2d3748; border-radius: 8px;
      color: #e2e8f0; font-family: monospace; font-size: 15px;
      padding: 12px 16px; width: 100%; max-width: 280px; outline: none;
      text-align: center; letter-spacing: 1px;
    }
    input:focus { border-color: #7c3aed; }
    input::placeholder { color: #2d3748; }

    /* ── Buttons ── */
    .btn {
      padding: 13px 32px; border-radius: 8px; font-family: monospace;
      font-size: 13px; letter-spacing: 2px; cursor: pointer;
      border: 1px solid; width: 100%; max-width: 280px;
      transition: transform 0.1s;
    }
    .btn:active { transform: scale(0.97); }
    .btn-primary { background: #7c3aed22; border-color: #7c3aed; color: #a78bfa; }
    .btn-secondary { background: transparent; border-color: #2d3748; color: #718096; }
    .btn-start { background: #059669; border-color: #34d399; color: #d1fae5; font-size: 14px; }
    .btn-danger { background: #dc262622; border-color: #dc2626; color: #fca5a5; }

    /* ── Room code display ── */
    .room-code-box {
      background: #111827; border: 1px solid #2d3748; border-radius: 10px;
      padding: 14px 24px; text-align: center; width: 100%; max-width: 280px;
    }
    .room-code { font-size: 30px; letter-spacing: 6px; color: #a78bfa; }

    /* ── Player list ── */
    #player-list { width: 100%; max-width: 280px; display: flex; flex-direction: column; gap: 6px; }
    .player-item {
      display: flex; align-items: center; gap: 10px;
      background: #111827; border-radius: 8px; padding: 8px 12px;
      font-size: 13px;
    }
    .player-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
    .player-host { font-size: 10px; color: #4a5568; margin-left: auto; }

    /* ── HUD ── */
    #hud {
      position: absolute; top: 0; left: 0; right: 0;
      display: flex; justify-content: space-between; align-items: flex-start;
      padding: 12px 16px; pointer-events: none;
    }
    .hud-block { display: flex; flex-direction: column; align-items: center; }
    .hud-label { font-size: 9px; letter-spacing: 2px; color: #2d3748; text-transform: uppercase; }
    .hud-val { font-size: 20px; color: #e2e8f0; line-height: 1; }
    #timer-val { color: #f6ad55; }

    /* ── Countdown ── */
    #countdown-screen { pointer-events: none; }
    #countdown-num { font-size: 80px; color: #a78bfa; text-shadow: 0 0 40px #7c3aed; animation: pop 0.4s ease-out; }
    @keyframes pop { 0%{transform:scale(1.8);opacity:0} 100%{transform:scale(1);opacity:1} }

    /* ── Results ── */
    .winner-name { font-size: 22px; color: #f6e05e; letter-spacing: 2px; }
    .score-row { display: flex; align-items: center; gap: 10px; font-size: 13px; width: 100%; max-width: 280px; }
    .score-row-inner { display: flex; flex-direction: column; gap: 5px; width: 100%; max-width: 280px; }
    .score-rank { color: #4a5568; font-size: 11px; width: 16px; }
    .score-name { flex: 1; }
    .score-pts { color: #a78bfa; font-family: monospace; }

    /* ── Error toast ── */
    #toast {
      position: absolute; bottom: 80px; left: 50%; transform: translateX(-50%);
      background: #dc2626; color: white; padding: 8px 20px; border-radius: 8px;
      font-size: 12px; letter-spacing: 1px; opacity: 0; transition: opacity 0.3s;
      pointer-events: none; white-space: nowrap;
    }
    #toast.show { opacity: 1; }

    /* ── Tap hint ── */
    #tap-hint {
      position: absolute; bottom: 24px; left: 50%; transform: translateX(-50%);
      font-size: 12px; color: #2d3748; letter-spacing: 2px; pointer-events: none;
      animation: blink 1.8s ease-in-out infinite;
    }
    @keyframes blink { 0%,100%{opacity:.3} 50%{opacity:1} }

    /* ── Dead overlay ── */
    #dead-banner {
      position: absolute; top: 45%; left: 50%; transform: translate(-50%,-50%);
      font-size: 16px; color: #f87171; letter-spacing: 3px;
      background: rgba(0,0,0,0.7); padding: 8px 20px; border-radius: 8px;
      display: none; pointer-events: none;
    }
  </style>
</head>
<body>
<div id="app">
  <canvas id="gc"></canvas>

  <!-- HUD (shown during game) -->
  <div id="hud" class="hidden">
    <div class="hud-block">
      <span class="hud-label">score</span>
      <span class="hud-val" id="score-val">0</span>
    </div>
    <div class="hud-block">
      <span class="hud-label">time</span>
      <span class="hud-val" id="timer-val">90</span>
    </div>
    <div class="hud-block">
      <span class="hud-label">alive</span>
      <span class="hud-val" id="alive-val">-</span>
    </div>
  </div>

  <div id="dead-banner">ELIMINATED</div>
  <div id="tap-hint" class="hidden">tap to launch</div>
  <div id="toast"></div>

  <!-- ── SCREEN: Home ── -->
  <div id="screen-home" class="screen">
    <div class="game-title">PLANET<br>PANIC</div>
    <div class="sub">real-time · multiplayer · chaos</div>
    <div style="height:8px;"></div>
    <div class="label">your name</div>
    <input id="input-name" type="text" maxlength="12" placeholder="enter name" autocomplete="off" />
    <button class="btn btn-primary" onclick="goCreate()">create room</button>
    <button class="btn btn-secondary" onclick="goJoin()">join room</button>
  </div>

  <!-- ── SCREEN: Join ── -->
  <div id="screen-join" class="screen hidden">
    <div class="game-title" style="font-size:22px;">join game</div>
    <div class="label">room code</div>
    <input id="input-code" type="text" maxlength="5" placeholder="XXXXX" autocomplete="off"
      style="text-transform:uppercase;font-size:22px;letter-spacing:6px;" />
    <button class="btn btn-primary" onclick="joinRoom()">join</button>
    <button class="btn btn-secondary" onclick="showScreen('screen-home')">back</button>
  </div>

  <!-- ── SCREEN: Lobby ── -->
  <div id="screen-lobby" class="screen hidden">
    <div class="game-title" style="font-size:22px;">lobby</div>
    <div class="room-code-box">
      <div class="label">room code — share with friends</div>
      <div class="room-code" id="lobby-code">-----</div>
    </div>
    <div id="player-list"></div>
    <button class="btn btn-start" id="btn-start" onclick="startGame()" style="display:none;">start game</button>
    <div class="sub" id="waiting-msg">waiting for host to start...</div>
    <button class="btn btn-secondary" onclick="leaveRoom()">leave</button>
  </div>

  <!-- ── SCREEN: Countdown ── -->
  <div id="screen-countdown" class="screen hidden" style="pointer-events:none;">
    <div id="countdown-num">3</div>
  </div>

  <!-- ── SCREEN: Results ── -->
  <div id="screen-results" class="screen hidden">
    <div class="sub">round over</div>
    <div class="winner-name" id="winner-name">---</div>
    <div class="sub">wins!</div>
    <div class="score-row-inner" id="results-scores"></div>
    <div class="sub" style="margin-top:8px;">returning to lobby...</div>
  </div>
</div>

<!-- Socket.io from CDN -->
<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
<script src="game.js"></script>
<script>
  // Register service worker for PWA
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(console.error);
  }
</script>
</body>
</html>
